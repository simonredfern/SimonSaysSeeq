[package]
name = "simon-says-seeq-rust"
version = "0.1.0"
edition = "2021"
authors = ["SimonSaysSeeq Contributors"]
description = "Pure Rust implementation of SimonSaysSeeq for Norns hardware"
license = "AGPL-3.0"

[[bin]]
name = "simon_says_seeq"
path = "src/main.rs"

[dependencies]
# MIDI handling (optional for development)
midir = { version = "0.9", optional = true }

# Audio/timing (optional for development)
cpal = { version = "0.15", optional = true }
# alsa = { version = "0.9", optional = true }  # Temporarily disabled for cross-compilation

# Input handling (encoders, buttons) (optional for development)
evdev = { version = "0.12", optional = true }

# Graphics/framebuffer (optional for development)
framebuffer = { version = "0.3", optional = true }

# Threading and async
tokio = { version = "1.0", features = ["full"] }
crossbeam-channel = "0.5"

# Data structures
rustc-hash = "1.1"
smallvec = "1.11"
arrayvec = "0.7"

# Serialization for state persistence
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Grid communication (USB HID) (optional for development)
hidapi = { version = "2.4", optional = true }

# Logging
log = "0.4"
env_logger = "0.10"

# Signal handling
ctrlc = "3.4"

# Configuration directories
dirs = "5.0"

# Random number generation
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["hardware", "midi"]
hardware = ["evdev", "framebuffer", "hidapi"]
hardware-audio = ["cpal"]
midi = ["midir"]
simulation = []
norns = ["hardware", "hardware-audio", "midi"]
cross-compile = ["midi"]  # Safe features for cross-compilation
desktop = ["midi", "hidapi"]  # Development on laptop with grid

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

# Cross-compilation target for Norns (ARM Linux)
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# Norns-specific build settings
[target.'cfg(target_arch = "arm")']
rustflags = ["-C", "target-feature=+neon"]