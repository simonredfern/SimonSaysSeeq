[package]
name = "midi-clock-generator"
version = "0.1.0"
edition = "2021"
authors = ["SimonSaysSeeq Contributors"]
description = "Standalone MIDI clock generator utility for testing sequencers"
license = "AGPL-3.0"

[[bin]]
name = "midi_clock_generator"
path = "midi_clock_generator.rs"

[[bin]]
name = "midi_clock_benchmark"
path = "src/bench.rs"

[dependencies]
midir = "0.9"
ctrlc = "3.4"
chrono = { version = "0.4", features = ["serde"] }
termion = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1