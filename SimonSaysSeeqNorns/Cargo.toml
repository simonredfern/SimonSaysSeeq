[package]
name = "simon-says-seeq-core"
version = "0.1.0"
edition = "2021"
authors = ["SimonSaysSeeq Contributors"]
description = "High-performance Rust core for SimonSaysSeeq sequencer"
license = "AGPL-3.0"

[lib]
name = "simon_says_seeq_core"
crate-type = ["cdylib"]

[dependencies]
mlua = { version = "0.9", features = ["lua53", "module"] }
serde = { version = "1.0", features = ["derive"] }
rustc-hash = "1.1"
smallvec = "1.11"
arrayvec = "0.7"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

# Cross-compilation target for Norns (ARM Linux)
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"